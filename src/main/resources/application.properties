spring.application.name=smart-university

# ==================== Socket.IO ====================
socketio.port=${SOCKETIO_PORT:9090}
socketio.host=${SOCKETIO_HOST:0.0.0.0}

# ==================== SpringDoc OpenAPI ====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# Database
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/smart_university?createDatabaseIfNotExist=true&sslMode=DISABLED&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=8085

# File Uploads (configurable via UPLOAD_DIR env var)
image.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:dev-placeholder@gmail.com}
spring.mail.password=${SMTP_PASSWORD:dev-placeholder}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000



# ==================== SSLCommerz ====================
sslcommerz.store-id=${SSLCOMMERZ_STORE_ID:}
sslcommerz.store-password=${SSLCOMMERZ_STORE_PASSWORD:}
sslcommerz.sandbox=${SSLCOMMERZ_SANDBOX:true}

# ==================== Frontend ====================
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# ==================== Jackson 3.x ====================
spring.jackson.default-property-inclusion=non_null

# ==================== Face Verification ====================
face.detection.cascade.path=haarcascade_frontalface_default.xml
face.encoding.model.path=openface_nn4.small2.v1.t7
face.match.threshold=0.6

# ==================== Logging ====================
level.com.smartuniversity=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO
